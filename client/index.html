<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Titans</title>
    <link rel="icon" href="data:," />
    <style>
      :root {
        --ink: #f4efe6;
        --ink-dim: rgba(244, 239, 230, 0.62);
        --panel: rgba(18, 20, 26, 0.42);
        --accent: #f2c14e;
        --cloak: #b8352a;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; overflow: hidden; background: #9fb4c8; }
      body { font: 13px/1.4 ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif; color: var(--ink); }
      canvas#game { display: block; width: 100vw; height: 100vh; outline: none; }

      #vignette {
        position: fixed; inset: 0; pointer-events: none;
        background: radial-gradient(ellipse at 50% 45%, transparent 55%, rgba(20, 16, 10, 0.32) 100%);
      }
      #perf { display: none; }
      body.debug #perf { display: block; }
      #perf {
        position: fixed; top: 10px; left: 10px; padding: 6px 9px; border-radius: 6px;
        background: var(--panel); font: 11px/1.45 ui-monospace, 'SF Mono', Menlo, monospace;
        color: var(--ink-dim); white-space: pre; pointer-events: none;
      }
      /* Grip (hud.ts): a leather strap with quarter ticks, a label, a ghost of what was lost. */
      #grip {
        position: fixed; left: 50%; bottom: 74px; transform: translate(-50%, 6px); display: flex; align-items: center; gap: 9px;
        opacity: 0; transition: opacity 0.35s, transform 0.35s; pointer-events: none;
      }
      #grip.on { opacity: 1; transform: translate(-50%, 0); }
      #grip .grip-label { font: italic 13px/1 'EB Garamond', Georgia, serif; letter-spacing: 0.12em; color: rgba(246, 240, 228, 0.82); text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8); }
      #grip .grip-track {
        position: relative; width: 168px; height: 9px; border-radius: 5px; overflow: hidden;
        background: linear-gradient(#2a1c10, #3a2818); box-shadow: 0 0 0 1px rgba(20, 12, 6, 0.85), 0 0 0 2px rgba(214, 180, 120, 0.28), 0 2px 8px rgba(0, 0, 0, 0.45);
      }
      #grip .grip-track > * { position: absolute; left: 0; top: 0; bottom: 0; display: block; }
      #grip b { width: 100%; background: rgba(255, 232, 190, 0.55); }
      #grip i { width: 100%; background: linear-gradient(#f4d488, #d9a648 60%, #b9832e); transition: background 0.3s; }
      #grip i::after { content: ''; position: absolute; right: 0; top: 0; bottom: 0; width: 6px; background: rgba(255, 246, 220, 0); transition: background 0.2s; }
      #grip.gain i::after { background: rgba(255, 246, 220, 0.85); box-shadow: 0 0 8px rgba(255, 236, 180, 0.9); }
      #grip u { right: 0; background: repeating-linear-gradient(90deg, transparent 0 calc(25% - 1px), rgba(20, 12, 6, 0.75) calc(25% - 1px) 25%); }
      #grip.low i { background: linear-gradient(#f08a6a, #d0452c 60%, #a8301c); animation: grip-low 0.7s ease-in-out infinite; }
      @keyframes grip-low { 50% { filter: brightness(1.45); } }
      #sight {
        position: fixed; inset: 0; pointer-events: none; opacity: 0;
        background: radial-gradient(ellipse at center, rgba(40, 90, 100, 0.06) 35%, rgba(6, 22, 28, 0.62) 100%);
      }
      #aim {
        position: fixed; left: 50%; top: 50%; width: 18px; height: 18px; margin: -9px 0 0 -9px; border-radius: 50%;
        border: 2px solid rgba(244, 239, 230, 0.85); box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.35);
        opacity: 0; transition: opacity 0.2s; pointer-events: none;
      }
      #aim::after { content: ''; position: absolute; left: 6px; top: 6px; width: 2px; height: 2px; background: #f4efe6; border-radius: 1px; }
      #aim.on { opacity: 1; }
      #bars::before, #bars::after {
        content: ''; position: fixed; left: 0; right: 0; height: 0; background: #050505;
        transition: height 2.2s ease-in-out; z-index: 5; pointer-events: none;
      }
      #bars::before { top: 0; }
      #bars::after { bottom: 0; }
      #bars.on::before, #bars.on::after { height: 11vh; }
      body:has(#bars.on) #hint, body:has(#bars.on) #minimap, body:has(#bars.on) #role, body:has(#bars.on) #prompt { opacity: 0; transition: opacity 1s; }
      #fade {
        position: fixed; inset: 0; background: #07080a; opacity: 0; pointer-events: none;
        transition: opacity 0.9s ease-in;
      }
      #fade.on { opacity: 1; transition: opacity 0.35s ease-out; }
      #loading {
        position: fixed; inset: 0; display: grid; place-items: center; overflow: hidden;
        background: #4f5a63; transition: opacity 0.8s;
      }
      /* While the land loads: the key art (concept/kneeling-giant.jpg, the game's own), full
         bleed, drifting slowly in; dark at the top for the title. (It was a bare gradient for
         ~5 s — QA Q16.) The title hides it: the real land is behind by then. */
      #loading::before {
        content: ''; position: absolute; inset: -2%; z-index: -1;
        background: linear-gradient(rgba(14, 16, 20, 0.62), rgba(14, 16, 20, 0.18) 42%, rgba(14, 16, 20, 0) 60%, rgba(14, 16, 20, 0.35)), url(/loading.webp) 62% 50% / cover no-repeat;
        animation: loading-drift 24s ease-out both;
      }
      #loading.title::before { display: none; }
      /* The title over the empty sky above the cliffs, left — clear of the giant (centred, it sat on
         its head and the line ran into the sword). A tall screen crops to the giant: centred there. */
      #loading:not(.title) { place-items: start; }
      #loading:not(.title) > div { margin: 11vh 0 0 7vw; }
      #loading:not(.title) h1, #loading:not(.title) p { text-align: left; }
      /* (A short screen — a phone on its side — sized by the height too: the title reached the giant.) */
      #loading:not(.title) h1 { font-size: min(10vw, 16vh, 112px); }
      @media (max-aspect-ratio: 1/1) {
        #loading:not(.title) { place-items: start center; }
        #loading:not(.title) > div { margin: 9vh 0 0; }
        #loading:not(.title) h1, #loading:not(.title) p { text-align: center; }
      }
      @keyframes loading-drift { from { transform: scale(1.0); } to { transform: scale(1.07) translate(-1%, 0.6%); } }
      @media (prefers-reduced-motion: reduce) { #loading::before { animation: none; } }
      #loading.done { opacity: 0; pointer-events: none; }
      /* The title: the land is ready behind it; a click wakes you. */
      #loading.title { cursor: pointer; background: linear-gradient(rgba(6, 7, 9, 0.92), rgba(10, 11, 14, 0.82) 60%, rgba(18, 16, 14, 0.9)); }
      #loading.title p { animation: breathe 3.2s ease-in-out infinite; letter-spacing: 0.3em; text-transform: lowercase; font-size: 22px; margin-top: 26px; color: rgba(255, 250, 240, 0.92); }
      @keyframes breathe { 0%, 100% { opacity: 0.55; } 50% { opacity: 1; } }
      /* Nothing over the title; and the key strip waits until you have taken your first steps (the first tip says it). */
      body.titling #role, body.titling #hint, body.titling #tips, body.early #hint { opacity: 0; }
      /* A shot the game takes (the reveal): the bars, and nothing else over it. */
      body.cine #role, body.cine #hint, body.cine #tips, body.cine #minimap, body.cine #tools { opacity: 0; transition: opacity 0.6s; }
      /* Before the traveller's map is found, no minimap. */
      body:not(.has-map) #minimap { display: none; }
      #loading h1 {
        margin: 0; font: 700 clamp(40px, 9vw, 96px)/1 ui-serif, Georgia, serif; letter-spacing: 0.18em;
        color: #fffaf0; text-shadow: 0 2px 30px rgba(0, 0, 0, 0.25); text-align: center;
      }
      #loading p { margin: 14px 0 0; text-align: center; color: rgba(255, 250, 240, 0.8); letter-spacing: 0.06em; }
    </style>
  </head>
  <body>
    <canvas id="game" tabindex="0"></canvas>
    <div id="vignette"></div>
    <div id="perf"></div>
    <div id="role"></div>
    <div id="hint"></div>
    <div id="grip"><i></i></div>
    <div id="tips"><span></span><button aria-label="Dismiss hints">✕</button></div>
    <div id="narration"></div>
    <canvas id="minimap" width="168" height="168"></canvas>
    <div id="fade"></div>
    <div id="bars"></div>
    <div id="prompt"></div>
    <div id="found"></div>
    <div id="aim"></div>
    <div id="tools"></div>
    <div id="sight"></div>
    <div id="bag">
      <div id="bag-frame">
        <h1><span>The Traveller's Bag</span><small id="bag-count"></small></h1>
        <div id="bag-grid"></div>
        <div id="bag-detail"></div>
      </div>
    </div>
    <div id="journal">
      <div id="journal-frame">
        <h1><span>What you have found</span><small id="journal-count"></small></h1>
        <div id="journal-body"></div>
      </div>
    </div>
    <div id="map">
      <div id="map-frame">
        <div id="map-title"><span>The Land</span><small id="map-explored"></small></div>
        <canvas id="map-canvas" width="900" height="900"></canvas>
      </div>
    </div>
    <div id="pause">
      <div id="pause-frame">
        <h1>Resting</h1>
        <p class="pause-sub">The world waits while you do.</p>
        <div id="pause-body"></div>
        <div class="pause-actions">
          <button id="pause-resume">Go on</button>
          <button id="pause-defaults" class="quiet">As it was made</button>
          <button id="pause-new" class="quiet">Begin again…</button>
          <span id="pause-sure"><em>Everything you have found will be forgotten.</em><button id="pause-yes" class="grave">Begin again</button><button id="pause-no" class="quiet">No</button></span>
        </div>
      </div>
    </div>
    <div id="loading">
      <div>
        <h1>TITANS</h1>
        <p id="loading-text">the land is waking</p>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
